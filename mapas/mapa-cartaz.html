<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa ilustrado da Quinta da Alameda</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;600;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Cartaz A3 horizontal para imprimir. No ecrã a folha encolhe à largura da janela (unidades cqw). */
:root{--paper:#f6eedb;--ink:#2b2420;--muted:#6e6253;--edge:#2b2420;--ground:#efe3c4;--ground2:#e4d4ab;--road:#fbf6ea;--wood:#9cb07a;--wood2:#7e9860;--trunk:#7a5638;--water:#8fc3d3;--water2:#5f9fb5;--olive:#c8cf92;--oliveT:#8f9f63;--roof:#c4623d;--wall:#f3e6c8;--poi:#c4623d;--gold:#d9a93a;--desk:#d9d3c4;--body:"Figtree",system-ui,sans-serif;--disp:"Gloock",Georgia,serif;--hand:"Caveat","Comic Sans MS",cursive}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#24221f}}
:root[data-theme="dark"]{--desk:#24221f}
html,body{margin:0;background:var(--desk)}
body{padding:16px;font-family:var(--body);color:var(--ink)}
.bar{max-width:1600px;margin:0 auto 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar{color:#e9e2d2}}
.bar button{font:600 14px var(--body);padding:9px 16px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.bar span{font-size:13px;opacity:.8}
.sheet{container-type:inline-size;max-width:1600px;margin:0 auto;aspect-ratio:420/297;background:var(--paper);box-shadow:0 10px 40px rgba(0,0,0,.25);position:relative;overflow:hidden}
.in{position:absolute;inset:1.6cqw;border:.35cqw solid var(--ink);border-radius:1.2cqw;display:grid;grid-template-rows:1fr auto;overflow:hidden}
.mapw{position:relative;background:var(--ground2)}
.mapw svg{position:absolute;inset:0;width:100%;height:100%}
.title{position:absolute;left:1.6cqw;bottom:1.4cqw;background:var(--paper);border:.3cqw solid var(--ink);border-radius:1cqw;padding:1cqw 1.8cqw 1.2cqw;box-shadow:.5cqw .5cqw 0 var(--ink);transform:rotate(-1.5deg)}
.title .k{font:700 1.5cqw var(--hand);color:var(--poi);line-height:1}
.title h1{font:400 3.6cqw/1 var(--disp);margin:0}.tlogo{display:block;height:7.5cqw;width:auto}
.title .s{font:600 1.05cqw var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:.5cqw}
.side{border-top:.35cqw solid var(--ink);padding:1.2cqw 1.6cqw 1cqw;display:grid;grid-template-columns:17cqw 1fr;gap:.6cqw 2cqw;background:var(--paper)}
.side .l{display:flex;flex-direction:column;gap:.8cqw}
ol{columns:4;column-gap:1.6cqw}
ol li{break-inside:avoid;margin-bottom:.32cqw}
.side h2{font:400 2cqw/1 var(--disp);margin:0}
.side h2 small{display:block;font:700 1.3cqw var(--hand);color:var(--poi);margin-top:.2cqw}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:1.8cqw 1fr;gap:.7cqw;align-items:center;font-size:.98cqw;line-height:1.15}
li .n{width:1.8cqw;height:1.8cqw;border-radius:50%;border:.22cqw solid var(--ink);background:#fff;display:grid;place-items:center;font:800 1cqw var(--body)}
li.p .n{border-radius:.5cqw;background:var(--poi);color:#fff;border-color:var(--ink)}
li.t .n{background:var(--gold)}
li b{font-weight:600}
li i{display:block;color:var(--muted);font-size:.85cqw}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:.3cqw .8cqw;font-size:.8cqw}
.legend span{display:flex;gap:.5cqw;align-items:center}
.legend i{width:1cqw;height:1cqw;border-radius:.3cqw;border:.15cqw solid var(--ink);flex:none}
.foot{font:700 1.3cqw var(--hand);color:var(--poi)}
@page{size:A3 landscape;margin:0}
@media print{
 html,body{background:#fff;padding:0}
 .bar{display:none}
 .sheet{width:420mm;height:297mm;max-width:none;box-shadow:none;aspect-ratio:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

     cardo:["O campo de cardo","No início do verão o cardo enche-se de flores roxas. A flor do cardo é a que tradicionalmente se usa para coalhar o queijo da Serra."],
     adega:["A adega","Onde as uvas da quinta são vinificadas e onde o vinho estagia até ser engarrafado."],
     armazem:["O armazém das alfaias","Guarda as máquinas e as alfaias da vinha. A cobertura tem painéis solares que produzem energia para a quinta."],
     casa:["A casa e a loja","A casa da quinta, em granito, com um grande alpendre aberto para o jardim. É aqui a loja, onde pode provar e comprar os vinhos e o azeite da quinta."],
     cascata:["A cascata","Uma pequena queda de água entre pedras cobertas de musgo e fetos, entre os tanques e o riacho."],
     bosque:["O bosque","Um bosque fresco e sombrio, com caminhos de terra. Bom para uma pausa nos dias de calor."],
     P10x:"Ao lado desta vinha fica o olival da quinta."}},
 en:{eyebrow:"DOC Dão",h1:"Estate map",lede:"A walk around the estate from the gate: vineyards, stone tanks, ponds, woodland and winery. Tap a number to learn more.",all:"All",t:"Red",b:"White",prev:"← Previous",next:"Next →",stop:"Stop",of:"of",ha:"ha",parcela:"Plot",castas:n=>n===1?"1 variety":n+" varieties",

  s:{entrada:["The entrance","The estate gate, set between walls of large stone blocks. From here the central track climbs through the vineyards to the tower."],
     olival:["The olive grove","The estate's olive grove, next to the vineyards and the farmhouse. Olive trees also line many of the paths."],
     torre:["The tower","The highest point of the estate and the walk's rest stop, a good place for a break. From the top you look west over the Pinot Noir, the Encruzado and the old vineyard, and beyond them the large Arinto vineyard, whose central band of smaller vines is Encruzado."],
     tanques:["The stone tanks","Old granite water tanks in the shade of the trees, just below the tower."],
     riacho:["The stream","A small stream runs along a stone channel between the olive trees and the vines."],
     charcas:["The wetland, ponds and beehives","The wetland floods in winter, like a small marsh, and dries out in summer. There are three ponds: they store water for the estate and attract a lot of wildlife, and the last one has macrophyte plants that help clean the water. The beehives are here: watch them from a distance and keep quiet."],
     cardo:["The cardoon field","In early summer the cardoons bloom purple. Cardoon flowers are traditionally used to curdle Serra da Estrela cheese."],

     armazem:["The machinery shed","Home to the vineyard machinery and tools. Its roof carries solar panels that power the estate."],
     casa:["The house and shop","The granite farmhouse, with a large open porch facing the garden. The shop is here: taste and buy the estate's wines and olive oil."],
     cascata:["The waterfall","A small waterfall tumbling over mossy stones and ferns, between the stone tanks and the stream."],
     bosque:["The woodland","Cool, shady woodland with earth paths. A good place for a break on a hot day."],
